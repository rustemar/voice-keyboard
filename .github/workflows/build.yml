name: Build & Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    # Pinned rather than ubuntu-latest: F-Droid rebuilds every release and ships it only if the
    # bytes match this APK, so a new runner image is taken on purpose, after comparing builds.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      # F-Droid builds each new v* tag and downloads the APK from the release named after the
      # version; a tag that differs from versionName, a version with letters in it, or a missing
      # store changelog breaks that update without anyone noticing.
      - name: Check tag, version and changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed -E 's/.*versionCode *= *([0-9]+).*/\1/')
          CHANGELOG="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
          [ "$GITHUB_REF_NAME" = "v$VERSION_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION_NAME"; exit 1; }
          [[ "$VERSION_NAME" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "::error::versionName $VERSION_NAME must be numbers and dots only"; exit 1; }
          [ -f "$CHANGELOG" ] || { echo "::error::$CHANGELOG is missing"; exit 1; }
          CHARS=$(LC_ALL=C.UTF-8 wc -m < "$CHANGELOG")
          [ "$CHARS" -le 500 ] || { echo "::error::$CHANGELOG has $CHARS characters, the store limit is 500"; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # v6 moved the default cache implementation to a proprietary Gradle service.
          # 'basic' keeps the MIT, GitHub-hosted one; on tag builds the cache is read-only
          # anyway, so there is nothing to gain from the commercial path.
          cache-provider: basic

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release-keystore.jks

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify release APK is signed
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::$v secret is empty; refusing to release an unsigned APK"; exit 1; }
          done
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/VoiceKeyboard.apk

      - name: Get version info
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          SHORT_SHA=${GITHUB_SHA::7}
          echo "name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: VoiceKeyboard-${{ steps.version.outputs.name }}-${{ steps.version.outputs.sha }}
          path: app/build/outputs/apk/release/*.apk

      - name: Read release notes
        if: startsWith(github.ref, 'refs/tags/v')
        id: notes
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            FIRST_LINE=$(head -1 RELEASE_NOTES.md)
            # If first line starts with "v" + digit (e.g. "v1.7.3 — Title"), treat it as the
            # release title and use the remainder (skipping the blank line after) as the body.
            # Otherwise fall back to using the entire file as body and let the tag name be the title.
            if [[ "$FIRST_LINE" =~ ^v[0-9] ]]; then
              TITLE="$FIRST_LINE"
              BODY=$(tail -n +3 RELEASE_NOTES.md)
            else
              TITLE=""
              BODY=$(cat RELEASE_NOTES.md)
            fi
            {
              echo "title=${TITLE}"
              echo 'body<<RELEASE_EOF'
              echo "${BODY}"
              echo 'RELEASE_EOF'
            } >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        # Third-party action pinned to a commit: this step runs after the signing keystore
        # has been decoded into the workspace, so a moving tag is not good enough.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: app/build/outputs/apk/release/*.apk
          name: ${{ steps.notes.outputs.title }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: ${{ steps.notes.outputs.body == '' }}
