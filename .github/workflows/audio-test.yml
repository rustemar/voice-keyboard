name: Audio comparison test APK

on:
  push:
    tags: ['audio-test-*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check isolated test tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^audio-test-[0-9]{8}\.[0-9]+$ ]] || exit 1
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Run tests
        run: ./gradlew testAudioTestUnitTest testDebugUnitTest
      - name: Decode keystore
        env:
          SIGNING_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          [ -n "$SIGNING_KEYSTORE" ] || exit 1
          printf '%s' "$SIGNING_KEYSTORE" | base64 -d > release-keystore.jks
      - name: Build isolated test APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for key_name in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!key_name}" ] || exit 1
          done
          ./gradlew assembleAudioTest
          cp app/build/outputs/apk/audioTest/VoiceKeyboard.apk VoiceKeyboardAudioTest.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs VoiceKeyboardAudioTest.apk
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          "$AAPT" dump badging VoiceKeyboardAudioTest.apk | grep "package: name='com.tyraen.voicekeyboard.audiotest'"
          sha256sum VoiceKeyboardAudioTest.apk > VoiceKeyboardAudioTest.apk.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: VoiceKeyboardAudioTest-${{ github.ref_name }}
          path: |
            VoiceKeyboardAudioTest.apk
            VoiceKeyboardAudioTest.apk.sha256
      - name: Publish test download
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ github.ref_name }}
          name: Audio comparison test — ${{ github.ref_name }}
          prerelease: true
          make_latest: false
          files: |
            VoiceKeyboardAudioTest.apk
            VoiceKeyboardAudioTest.apk.sha256
          body: |
            Separate audio comparison utility. Installs alongside Voice Keyboard as a different app; does not change keyboard settings.

            Record once, create WAV, Opus 64/128/200 kbps and AAC 128 kbps from the same source, then save a ZIP or explicitly compare recognition using your own API key. No post-processing or recent context. English and Russian interface.

            This is an experimental test download, not a stable keyboard update. It is excluded from the current F-Droid tag pattern and the keyboard updater skips prereleases.

            Instructions and limitations: [Audio testing](https://github.com/rustemar/voice-keyboard/blob/${{ github.sha }}/AUDIO_TESTING.md).
